[project]
name = "seds500-graduation-project"
version = "0.1.0"
description = "Tabular Data Augmentation using Diffusion Models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "ipykernel>=6.0.0",
    "imbalanced-learn>=0.14.1",
    "openpyxl>=3.1.5",
    "smogn>=0.1.2",
    "ctgan>=0.11.1",
    "python-docx>=1.2.0",
    "seaborn>=0.13.2",
    "scipy>=1.11.0",
    "ucimlrepo>=0.0.7",
    "torch>=2.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
